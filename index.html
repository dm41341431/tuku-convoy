<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>土庫・虎尾 車隊即時地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#111827;background:#e5e7eb}
#map{position:absolute;inset:0}
.top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
.title{pointer-events:auto;background:#1f2937;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}
.dot.on{background:#22c55e}.dot.err{background:#ef4444}
.tools{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.tbtn{background:#fff;border:0;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);color:#111827}
.sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);padding:10px 12px calc(env(safe-area-inset-bottom) + 12px)}
.cars{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.cars::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:2px solid #e5e7eb;border-radius:12px;padding:5px 8px;font-size:13px;line-height:1.2;text-align:center;min-width:56px;background:#fff}
.chip b{display:block;font-size:15px}
.chip small{color:#6b7280;font-size:11px}
.chip.live{border-color:var(--c)}
.chip.live b{color:var(--c)}
.chip.stale{opacity:.6}
.chip.off{opacity:.35}
.row{display:flex;gap:8px;align-items:center}
select,input{font-size:16px;padding:10px;border:1.5px solid #d1d5db;border-radius:10px;background:#fff;color:#111827}
select{flex:0 0 auto}
input{flex:1;min-width:0}
.big{width:100%;margin-top:8px;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:700;color:#fff;background:#2563eb}
.big.stop{background:#dc2626}
.status{font-size:14px;color:#374151;margin-top:6px}
.status.warn{color:#b45309}
.hint{font-size:12px;color:#6b7280;margin-top:6px}
.carIcon{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.carIcon.stale{filter:grayscale(1);opacity:.75}
.carIcon.me{outline:3px solid #111827}
.carLabel{background:rgba(17,24,39,.85);color:#fff;border:0;border-radius:6px;padding:1px 6px;font-size:12px;box-shadow:none}
.carLabel:before{display:none}
.stopIcon{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #111827}
.panel{position:absolute;z-index:1100;inset:0;background:rgba(0,0,0,.35);display:none}
.panel.show{display:block}
.panel .box{position:absolute;left:0;right:0;bottom:0;max-height:75%;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px)}
.panel h3{margin:0 0 8px;font-size:17px}
.seg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f3f4f6}
.seg i{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.seg span{flex:1;font-size:15px}
.seg a{background:#111827;color:#fff;text-decoration:none;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.seg button{background:#f3f4f6;border:0;border-radius:10px;padding:7px 10px;font-size:13px}
.close{width:100%;margin-top:10px;border:0;background:#f3f4f6;border-radius:12px;padding:12px;font-size:16px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="title"><span class="dot" id="conn"></span>車隊即時地圖</div>
  <div class="tools">
    <button class="tbtn" id="btnRoute">路線</button>
    <button class="tbtn" id="btnAll">全部車</button>
    <button class="tbtn" id="btnMe">我</button>
  </div>
</div>

<div class="sheet">
  <div class="cars" id="cars"></div>
  <div id="joinBox">
    <div class="row">
      <select id="carSel"></select>
      <input id="nameIn" maxlength="12" placeholder="稱呼（選填，例：阿明）">
    </div>
    <button class="big" id="btnShare">開始分享我的位置</button>
    <div class="hint">只看不分享也可以。分享時請讓這個網頁保持開著、螢幕亮著（建議接充電）。</div>
  </div>
  <div id="liveBox" style="display:none">
    <div class="status" id="liveStatus"></div>
    <button class="big stop" id="btnStop">停止分享</button>
  </div>
</div>

<div class="panel" id="routePanel"><div class="box">
  <h3>路線分段・Google 導航</h3>
  <div id="segList"></div>
  <button class="close" id="btnClose">關閉</button>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>

const NCARS = 10;
const qs = new URLSearchParams(location.search);
const ROOM = qs.get('room') || '0d0ec7a16359';
const BASE = 'tuku-huwei-convoy/' + ROOM + '/car/';
const COLORS = ['#dc2626','#ea580c','#ca8a04','#16a34a','#0891b2','#2563eb','#7c3aed','#db2777','#4b5563','#0f766e'];
const STALE_MS = 90*1000, OFF_MS = 30*60*1000;
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

// ---------- map ----------
const map = L.map('map', {zoomControl:false, attributionControl:true, zoomSnap:0.25});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
const routeBounds = L.latLngBounds([]);
DATA.segs.forEach((s,i)=>{
  L.polyline(s.pts, {color:'#fff', weight:9, opacity:.9}).addTo(map);
  const line = L.polyline(s.pts, {color:s.color, weight:5, opacity:.95}).addTo(map);
  line.bindPopup(`<b>${s.name}</b><br><a href="${s.link}" target="_blank" rel="noopener">用 Google 地圖導航這一段</a>`);
  s.pts.forEach(p=>routeBounds.extend(p));
});
DATA.stops.forEach(st=>{
  L.marker([st.lat, st.lng], {icon:L.divIcon({className:'', html:'<div class="stopIcon"></div>', iconSize:[14,14]})})
   .addTo(map).bindTooltip(st.name, {direction:'top', offset:[0,-6]});
});
map.fitBounds(routeBounds, {padding:[20,20]});

function fitAdjusted(bounds){
  const sheetH = document.querySelector('.sheet').offsetHeight;
  map.fitBounds(bounds, {paddingTopLeft:[24,70], paddingBottomRight:[24, sheetH+20], maxZoom:17});
}
setTimeout(()=>{map.invalidateSize(); fitAdjusted(routeBounds);}, 300);

// ---------- route panel ----------
const segList = document.getElementById('segList');
DATA.segs.forEach((s,i)=>{
  const d = document.createElement('div'); d.className='seg';
  d.innerHTML = `<i style="background:${s.color}"></i><span>${s.name}</span><button data-i="${i}">看</button><a href="${s.link}" target="_blank" rel="noopener">導航</a>`;
  segList.appendChild(d);
});
segList.addEventListener('click', e=>{
  const i = e.target.dataset && e.target.dataset.i;
  if (i!==undefined){ panel(false); fitAdjusted(L.latLngBounds(DATA.segs[i].pts)); }
});
const panelEl = document.getElementById('routePanel');
function panel(show){ panelEl.classList.toggle('show', show); }
document.getElementById('btnRoute').onclick = ()=>panel(true);
document.getElementById('btnClose').onclick = ()=>panel(false);
panelEl.addEventListener('click', e=>{ if(e.target===panelEl) panel(false); });

// ---------- cars state ----------
const cars = {}; // n -> {lat,lng,t,name,marker}
const carsEl = document.getElementById('cars');
const carSel = document.getElementById('carSel');
for (let n=1;n<=NCARS;n++){
  const o = document.createElement('option'); o.value=n; o.textContent=`第 ${n} 號車`; carSel.appendChild(o);
  const c = document.createElement('div'); c.className='chip off'; c.id='chip'+n; c.style.setProperty('--c', COLORS[n-1]);
  c.innerHTML = `<b>${n}號</b><small>未上線</small>`;
  c.onclick = ()=>{ const s=cars[n]; if(s&&s.lat!=null) map.setView([s.lat,s.lng], Math.max(map.getZoom(),16)); };
  carsEl.appendChild(c);
}
const preCar = qs.get('car') || store.get('car');
if (preCar && +preCar>=1 && +preCar<=NCARS) carSel.value = preCar;
document.getElementById('nameIn').value = store.get('name') || '';

let myCar = null;
function ago(ms){
  const s = Math.max(0, Math.round(ms/1000));
  if (s<60) return s+' 秒前';
  if (s<3600) return Math.floor(s/60)+' 分鐘前';
  return Math.floor(s/3600)+' 小時前';
}
function iconFor(n, stale){
  return L.divIcon({className:'', iconSize:[34,34], iconAnchor:[17,17],
    html:`<div class="carIcon ${stale?'stale':''} ${n==myCar?'me':''}" style="background:${COLORS[n-1]}">${n}</div>`});
}
function render(){
  const now = Date.now();
  for (let n=1;n<=NCARS;n++){
    const s = cars[n], chip = document.getElementById('chip'+n);
    if (!s || s.lat==null || now - s.t > OFF_MS){
      if (s && s.marker){ map.removeLayer(s.marker); s.marker=null; }
      chip.className='chip off'; chip.innerHTML=`<b>${n}號</b><small>未上線</small>`; continue;
    }
    const stale = now - s.t > STALE_MS;
    const label = (s.name? s.name+' · ':'') + ago(now - s.t);
    if (!s.marker){
      s.marker = L.marker([s.lat,s.lng], {icon:iconFor(n,stale), zIndexOffset:1000}).addTo(map)
        .bindTooltip('', {permanent:true, direction:'right', offset:[16,0], className:'carLabel'});
    } else s.marker.setLatLng([s.lat,s.lng]);
    if (s._stale !== stale || s._me !== (n==myCar)){ s.marker.setIcon(iconFor(n,stale)); s._stale=stale; s._me=(n==myCar); }
    s.marker.setTooltipContent(`${n}號 ${s.name||''}`.trim());
    chip.className = 'chip ' + (stale?'live stale':'live');
    chip.innerHTML = `<b>${n}號</b><small>${s.name?s.name+'<br>':''}${ago(now-s.t)}</small>`;
  }
  updateLiveStatus();
}
setInterval(render, 5000);

// ---------- MQTT ----------
const connEl = document.getElementById('conn');
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
let client, brokerIdx = 0;
function connect(){
  client = mqtt.connect(BROKERS[brokerIdx], {clientId:'cv_'+Math.random().toString(16).slice(2,10), clean:true, reconnectPeriod:3000, connectTimeout:8000, keepalive:30});
  let everConnected = false;
  client.on('connect', ()=>{
    everConnected = true; connEl.className='dot on';
    client.subscribe(BASE+'+', {qos:0});
    if (lastPos) publish(true);
  });
  client.on('reconnect', ()=>{ connEl.className='dot'; });
  client.on('offline', ()=>{ connEl.className='dot err'; });
  client.on('error', ()=>{ connEl.className='dot err'; });
  client.on('close', ()=>{
    connEl.className='dot err';
    if (!everConnected){ client.end(true); brokerIdx=(brokerIdx+1)%BROKERS.length; setTimeout(connect, 1000); }
  });
  client.on('message', (topic, payload)=>{
    const n = +topic.slice(BASE.length);
    if (!(n>=1 && n<=NCARS)) return;
    const txt = payload.toString();
    cars[n] = cars[n] || {};
    if (!txt){ cars[n].lat=null; render(); return; }
    try{
      const m = JSON.parse(txt);
      if (typeof m.lat!=='number' || typeof m.lng!=='number') return;
      Object.assign(cars[n], {lat:m.lat, lng:m.lng, t:Math.min(m.t||Date.now(), Date.now()), name:(m.name||'').slice(0,12)});
      render();
    }catch(e){}
  });
}
connect();

// ---------- sharing ----------
let watchId = null, lastPos = null, lastSent = 0, wakeLock = null, sentPos = null;
const liveStatus = document.getElementById('liveStatus');
function myName(){ return document.getElementById('nameIn').value.trim().slice(0,12); }
function dist(a,b){ const R=6371000, toR=Math.PI/180; const dLa=(b.lat-a.lat)*toR, dLo=(b.lng-a.lng)*toR;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function publish(force){
  if (!myCar || !lastPos || !client || !client.connected) return;
  const now = Date.now();
  if (!force && now-lastSent < 4000) return;
  if (!force && sentPos && now-lastSent < 20000 && dist(sentPos,lastPos) < 15) return;
  lastSent = now; sentPos = {...lastPos};
  client.publish(BASE+myCar, JSON.stringify({lat:+lastPos.lat.toFixed(6), lng:+lastPos.lng.toFixed(6), t:now, name:myName()}), {qos:0, retain:true});
}
setInterval(()=>publish(false), 5000);
function updateLiveStatus(){
  if (!myCar) return;
  let txt = `第 ${myCar} 號車 分享中`;
  liveStatus.className='status';
  if (!lastPos){ txt += ' · 正在取得 GPS…'; liveStatus.className='status warn'; }
  else txt += ` · 精準度約 ${Math.round(lastPos.acc)} 公尺 · 上傳 ${lastSent?ago(Date.now()-lastSent):'等待中'}`;
  if (!client || !client.connected){ txt += ' · 網路連線中…'; liveStatus.className='status warn'; }
  liveStatus.textContent = txt;
}
async function keepAwake(){
  try{ if ('wakeLock' in navigator && document.visibilityState==='visible'){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if (myCar && document.visibilityState==='visible'){ keepAwake(); publish(true); } });

document.getElementById('btnShare').onclick = ()=>{
  if (!('geolocation' in navigator)){ alertBox('這支手機的瀏覽器不支援定位。'); return; }
  const n = +carSel.value;
  const taken = cars[n] && cars[n].lat!=null && Date.now()-cars[n].t < STALE_MS;
  if (taken && !confirmBox(n)) return;
  myCar = n; store.set('car', n); store.set('name', myName());
  document.getElementById('joinBox').style.display='none';
  document.getElementById('liveBox').style.display='block';
  updateLiveStatus();
  keepAwake();
  watchId = navigator.geolocation.watchPosition(p=>{
    const first = !lastPos;
    lastPos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
    cars[myCar] = cars[myCar] || {};
    Object.assign(cars[myCar], {lat:lastPos.lat, lng:lastPos.lng, t:Date.now(), name:myName()});
    publish(first); render();
    if (first) map.setView([lastPos.lat,lastPos.lng], 16);
  }, err=>{
    liveStatus.className='status warn';
    liveStatus.textContent = err.code===1 ? '定位權限被拒絕：請到瀏覽器或手機設定允許這個網站使用位置，再重新整理。' : '暫時抓不到 GPS，持續嘗試中…';
  }, {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
};
document.getElementById('btnStop').onclick = ()=>{
  if (watchId!==null) navigator.geolocation.clearWatch(watchId);
  if (client && client.connected && myCar) client.publish(BASE+myCar, '', {qos:0, retain:true});
  if (wakeLock){ try{wakeLock.release()}catch(e){} wakeLock=null; }
  if (cars[myCar]) cars[myCar].lat=null;
  watchId=null; lastPos=null; sentPos=null; lastSent=0; myCar=null;
  document.getElementById('joinBox').style.display='block';
  document.getElementById('liveBox').style.display='none';
  render();
};
// in-page confirm (no browser dialogs)
function confirmBox(n){ return window.__forceTake===n ? true : (showTake(n), false); }
function showTake(n){
  const btn = document.getElementById('btnShare');
  btn.textContent = `第 ${n} 號車已有人在分享，再按一次確定接手`;
  window.__forceTake = n;
  setTimeout(()=>{ btn.textContent='開始分享我的位置'; window.__forceTake=null; }, 5000);
}
function alertBox(msg){ const h=document.querySelector('#joinBox .hint'); h.textContent=msg; h.style.color='#b91c1c'; }

// ---------- tools ----------
document.getElementById('btnAll').onclick = ()=>{
  const b = L.latLngBounds([]);
  Object.values(cars).forEach(s=>{ if(s.lat!=null && Date.now()-s.t<OFF_MS) b.extend([s.lat,s.lng]); });
  if (b.isValid()) fitAdjusted(b.pad(0.2)); else fitAdjusted(routeBounds);
};
let meMarker=null;
document.getElementById('btnMe').onclick = ()=>{
  if (lastPos){ map.setView([lastPos.lat,lastPos.lng], 17); return; }
  if (!('geolocation' in navigator)) return;
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if (!meMarker) meMarker = L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2563eb',fillOpacity:1}).addTo(map).bindTooltip('我（未分享）');
    else meMarker.setLatLng(ll);
    map.setView(ll, 16);
  }, ()=>{}, {enableHighAccuracy:true, timeout:15000});
};
</script>
